# --- Plugin identity -------------------------------------------------------
# pluginGroup is the reverse-domain package root. The <id> in plugin.xml must never change after the
# first Marketplace upload: the listing and every installed copy's updates are keyed to it.
pluginGroup = io.github.yendrrek.stageotherfiles
pluginName = Stage Other Files
pluginVersion = 0.1.0-SNAPSHOT

# --- Compatibility ---------------------------------------------------------
# Compile baseline and oldest supported IDE. 242 == IntelliJ IDEA 2024.2, which requires JDK 21.
# Raising either drops users on older IDEs and is a major version bump.
platformVersion = 2024.2.6
pluginSinceBuild = 242

# --- Build behaviour -------------------------------------------------------
# The platform bundles the Kotlin stdlib; bundling a second copy causes conflicts.
kotlin.stdlib.default.dependency = false

org.gradle.configuration-cache = true
org.gradle.caching = true
org.gradle.jvmargs = -Xmx2g -XX:MaxMetaspaceSize=768m
